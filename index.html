<script>
/* ---------------- data ---------------- */
const C = { green:"#3FB950", amber:"#E0A93B", red:"#E5534B", border:"#293646", accent:"#5EC8D8", faint:"#5A6675" };
const GRADE = {
  g:{label:"Nailed it", color:C.green, box:b=>Math.min(b+1,5)},
  y:{label:"Shaky",     color:C.amber, box:_=>2},
  r:{label:"Missed it",  color:C.red,   box:_=>1},
};
const BANK = [
 {id:"react",name:"React fundamentals",domain:"frontend",slope:"deep",cards:[
  {id:"react-1",level:2,q:"Why does a React component re-render, and what actually triggers it?",a:"A component re-renders when its own state changes, when its parent re-renders, or when a context it consumes changes. The case people get wrong is the parent one: when a component re-renders, React re-renders all of its children by default, whether or not their props changed, because it can't know for free that the props are equivalent.||And re-rendering means React calls the function again and diffs the result against the previous tree; it does not necessarily mean it touches the DOM. So the mental model is that rendering is frequent and fairly cheap, committing to the DOM is the expensive part, and most performance work is about avoiding renders that produce identical output."},
  {id:"react-2",level:3,q:"In React, what does referential identity have to do with re-renders?",a:"In JavaScript an object, array, or function created during render is a brand-new reference every time, even when it looks identical, so an empty object never equals another empty object. That matters because React's bail-out mechanisms, like React.memo or a dependency array, compare by reference.||So if I pass a fresh inline function or object to a memoized child, the memo is useless, because the reference changed and React assumes the prop changed. That's the whole reason useMemo and useCallback exist: they hold a stable reference across renders so downstream comparisons can short-circuit. Referential identity is the hidden variable behind most 'why is this re-rendering' puzzles."},
  {id:"react-3",level:3,q:"What does the React Compiler change about that whole picture?",a:"The React Compiler memoizes automatically at build time. It works out which values and components actually depend on which inputs and inserts the equivalent of useMemo, useCallback, and memo wherever it can prove that's safe.||So the manual referential-identity bookkeeping largely goes away and I get to write straightforward code without hand-guarding every value. I'd still understand the underlying mechanism, because when something misbehaves I have to reason about it, but the day-to-day tax of manual memoization drops."},
  {id:"react-4",level:2,q:"When do you reach for a Server Component versus a Client Component?",a:"My default is a Server Component, because it fetches data and renders on the server and ships none of that code to the browser. So anything that's mostly reading data and rendering markup stays on the server.||The moment a component needs interactivity, state, effects, or a browser API, it becomes a Client Component and I mark it explicitly. The model I hold is that Server Components get data onto the page cheaply, and Client Components are the parts the user actually pokes at. Keeping that boundary tight is also a bundle win, because the interactive JavaScript only contains what genuinely runs in the browser."},
  {id:"react-5",level:3,q:"Walk through the React 19 form and action hooks.",a:"The theme in React 19 is first-class support for asynchronous transitions, which they call Actions. useActionState wraps an async action and hands back the current state, a wrapped action to call, and a pending flag, so a form that talks to the server manages its own loading and result without three separate useState calls.||useFormStatus, which comes from react-dom, lets a nested piece like a submit button read whether the surrounding form is submitting, without threading a prop down every level. useOptimistic shows the expected result immediately while the real request is in flight and then reconciles, which is exactly what you want for showing a payment as pending. And the use API lets me read a promise or context conditionally. Together they cut out most of the manual pending-and-error plumbing I used to write by hand."},
  {id:"react-6",level:2,q:"useEffect is overused. When is an effect the wrong tool?",a:"An effect is for synchronizing with something outside React, like the network, a subscription, the DOM, or a timer. It's the wrong tool when the thing you want can be computed during render from existing state or props, because then you've added an extra render and a chance for the UI to flash a stale value.||The classic smell is an effect that sets state derived from other state; that should just be a value computed in render, or useMemo if it's genuinely expensive. Another smell is an effect reacting to a user action; that logic belongs in the event handler, which runs before the render and knows what the user actually did."},
  {id:"react-7",level:3,q:"What problem do keys solve in a React list, and what breaks with index keys?",a:"Keys tell React's diff which item is which across renders, so it can match elements to their previous instances instead of tearing down and rebuilding. With a stable identity-based key, reordering or inserting is cheap and each item's component state stays attached to the right item.||Using the array index as the key breaks exactly when the list reorders, inserts, or removes in the middle, because the index now points at a different item. React reuses the wrong DOM and, worse, the wrong state, so a text input's value or a checkbox can jump to a neighboring row. Index keys are only safe for a static list that never reorders."},
  {id:"react-8",level:2,q:"How do you reason about a slow React screen?",a:"I find out what's actually re-rendering and why rather than guessing, so I reach for the Profiler in React DevTools and look for components rendering far more often than their data changes. The usual culprits are state living too high so a change re-renders a big subtree, a new object or function created inline every render breaking memoization, or a long list rendering every row when a handful are on screen.||The fixes map to the causes: push state down to the smallest component that needs it, stabilize the values feeding memoized children, and virtualize long lists so only the visible rows render. The principle underneath it all is that the cheapest render is the one that never happens."},
  {id:"react-9",level:3,q:"In React, controlled versus uncontrolled components, and why it matters at scale.",a:"A controlled component has its value driven by React state, so React is the single source of truth and every keystroke flows through state. An uncontrolled component lets the DOM hold the value and you read it when you need it, usually through a ref.||Controlled gives you validation, formatting, and conditional logic on every change, at the cost of a render per keystroke. At scale that shows up in big forms, which can get janky because every field change re-renders the whole form, and it's why many form libraries go uncontrolled under the hood and only subscribe the pieces that need to react. The judgment is to reach for controlled when a field needs live behavior and let the DOM own the rest."},
 ]},
 {id:"ts",name:"TypeScript fundamentals",domain:"frontend",slope:"deep",cards:[
  {id:"ts-1",level:3,q:"What's a discriminated union and why is it better than a bag of optional fields?",a:"A discriminated union models a value that is genuinely one of several distinct shapes, using a shared literal field, the discriminant, to tell them apart. A payment isn't one shape with lots of optional fields; it's a pending case, a succeeded case that carries a transaction id, and a failed case that carries a reason.||The payoff is that when I switch on the discriminant, TypeScript narrows the type inside each branch, so it won't let me read the transaction id off a payment that failed, because that field doesn't exist on that variant. A whole class of runtime bugs becomes compile errors, which in payment code is exactly the trade I want. I'd also make the union exhaustive, so adding a new state forces every switch to handle it."},
  {id:"ts-2",level:2,q:"In TypeScript, what's the difference between unknown, any, and never?",a:"any switches off type-checking for that value entirely, so unsafety spreads silently through everything it touches; it's a last-resort escape hatch. unknown is its safe counterpart: it can hold anything, but the compiler makes you narrow it before you can use it, so it's what you want at trust boundaries like parsing JSON or catching an error.||never is the type with no values, which sounds useless but is how you model impossibility. A function that always throws returns never, and never is the mechanism behind exhaustiveness checks, because assigning a leftover case to a never-typed variable makes the compiler fail if you forgot a case."},
  {id:"ts-3",level:3,q:"How do generics let you write a type-safe API layer?",a:"The goal is a single source of truth for the data's shape so the types can't drift between server and client. I define the request and response shapes with a runtime schema, something like Zod, and derive the TypeScript types from that schema rather than writing them twice.||That gives two things at once: the server validates incoming data against the same schema at runtime, so bad input is rejected at the edge, and both sides share the exact static types, so if the shape changes the compiler lights up everywhere that needs updating. A generic fetch wrapper can tie the endpoint to its response type, so the calling code knows precisely what it gets back. A type I only assert but never check at the boundary is a lie I'm telling the compiler."},
  {id:"ts-4",level:2,q:"What is structural typing in TypeScript, and how does it differ from nominal typing?",a:"TypeScript types are structural, meaning two types are compatible if their shapes match, regardless of their names. If a value has all the properties a type requires, it fits, even if it was never declared as that type. That's different from nominal typing in Java or C#, where a type has to be declared by name to match.||Structural typing is why duck-typed JavaScript patterns feel natural in TypeScript. It's also why you sometimes want a branded type, deliberately adding a unique marker property, to stop two structurally identical things, like a UserId and an OrderId that are both strings, from being used interchangeably."},
  {id:"ts-5",level:3,q:"In TypeScript, explain keyof and indexed access, and type a function that gets a property by name.",a:"keyof T gives the union of T's keys as string literals, and an indexed access type T[K] gives the type of the value at key K. Together they let me write a get function whose return type depends on the key you ask for: get<T, K extends keyof T>(obj: T, key: K): T[K].||Now if I call get on a user with the key 'age', the compiler knows the result is a number, not just 'some property,' and it rejects a key that doesn't exist. That's the essence of TypeScript's real power, which is types computed from other types rather than written out by hand."},
  {id:"ts-6",level:2,q:"What does strictNullChecks change and why does it matter?",a:"With strictNullChecks on, null and undefined stop being silently assignable to every type and become their own types you have to handle explicitly. So the compiler forces you to deal with a possibly-missing value before you use it, which turns a huge class of 'cannot read property of undefined' crashes into compile errors.||It's the single most valuable strictness flag, and any serious codebase should have it on. The cost is more explicit guards, but that's the point: the guard was always necessary, the compiler is just making sure you didn't forget it."},
  {id:"ts-7",level:3,q:"What are mapped and conditional types good for in real code?",a:"A mapped type transforms every property of a type uniformly; that's how utilities like Partial, Readonly, and Pick are built, by iterating the keys and rewriting each one. A conditional type chooses between two types based on a test, written like T extends U ? X : Y, so a type can react to what it's given.||In real code I reach for them to keep a single source of truth. For example, deriving a form's error shape from the form's data shape with a mapped type, so adding a field updates the error type automatically. The goal is always to compute types from one canonical type rather than maintaining parallel definitions that drift apart."},
  {id:"ts-8",level:2,q:"In TypeScript, interface versus type — does the choice matter?",a:"For most object shapes they're interchangeable and I wouldn't let a team burn energy debating it. The real differences: interfaces can be reopened and merged, which is occasionally useful for augmenting third-party types but is also a footgun because declarations can accumulate invisibly. Type aliases express things interfaces can't, like unions, tuples, and the mapped and conditional types.||My rule of thumb is interfaces for public object shapes that might be extended, and type aliases for unions and anything computed. Consistency across the codebase matters more than the choice itself."},
  {id:"ts-9",level:3,q:"You catch an error and TypeScript types it as unknown. How do you handle it?",a:"Since a thrown value can be literally anything in JavaScript, TypeScript types the catch binding as unknown, which is correct, and it forces me to narrow before using it. So I check what it actually is, usually with an instanceof Error check, and handle the non-Error case explicitly instead of assuming there's a message property.||In practice I often keep a small helper that normalizes an unknown caught value into a real Error, so the rest of the code has something typed to work with. The discipline is that the boundary where something enters my program untyped is exactly where I validate it, and a catch block is one of those boundaries."},
 ]},
 {id:"befund",name:"Backend fundamentals",domain:"backend",slope:"climb",cards:[
  {id:"bf-1",level:1,q:"Step by step, what happens when a request hits your API?",a:"The client opens a connection, usually reusing a pooled TCP connection and, over HTTPS, an already-negotiated TLS session, so the handshake cost is often paid. The request arrives with a method, a path, headers, and maybe a body. My router matches the method and path to a handler.||Before the handler does real work, middleware runs, parsing the body, authenticating the caller, and validating input. The handler then does its job, usually talking to a database or another service, and returns a status code and a body. This chain matters because every step is somewhere latency or a bug can hide."},
  {id:"bf-2",level:1,q:"What do the main HTTP status code classes communicate, and why care?",a:"The classes carry meaning: 2xx success, 3xx redirection, 4xx the client got it wrong, 5xx the server did. The 4xx-versus-5xx split is the one that matters operationally, because it decides whether an alert should wake someone: a spike of 400s is usually clients sending bad input, while a spike of 500s is your problem.||Specific ones worth using correctly: 401 not authenticated, 403 authenticated but not allowed, 404 not found, 409 conflict which is handy for version clashes and idempotency, 422 for validation failures, 429 for rate limiting. Using them precisely lets clients and dashboards react without parsing your error text."},
  {id:"bf-3",level:2,q:"REST versus GraphQL. How do you choose?",a:"REST models the system as resources you act on with HTTP methods, which is simple, cacheable at the HTTP layer, and easy to reason about, but it tends toward over-fetching or many round trips when a screen needs several resources. GraphQL lets the client ask for exactly the shape it needs in one request, which suits rich varied frontends, but it moves complexity to the server, weakens simple HTTP caching, and opens the door to expensive nested queries you have to guard.||My rule of thumb is REST for straightforward resource APIs and service-to-service calls, and GraphQL when you have many clients with divergent data needs. For a payments service I'd lean REST, because the operations are well-defined and I want the simplicity and the caching story."},
  {id:"bf-4",level:2,q:"Authentication versus authorization, and how do you implement each?",a:"Authentication is proving who you are; authorization is what you're allowed to do, and conflating them is a classic source of security holes. For authentication on a customer-facing web platform I lean toward session tokens in httpOnly, Secure, SameSite cookies, because keeping the token out of JavaScript's reach closes off a whole category of cross-site scripting theft. If we use JWTs, I keep the access token short-lived and pair it with a rotating refresh token, so a leaked token has a small blast radius.||On the authorization side I check permissions in the service layer, close to the business logic, rather than trusting a check up at the edge, because that's the layer that knows what the operation actually does. And with cookie auth I make sure cross-site request forgery is handled, since that's exactly what it targets."},
  {id:"bf-5",level:2,q:"What is idempotency and why does it matter for an API?",a:"An operation is idempotent if doing it twice has the same effect as doing it once. It matters because networks are unreliable: a client sends a request, the response is lost, and the client retries, and if that operation was 'charge the card,' you've charged twice unless it was idempotent.||The standard technique is an idempotency key: the client sends a unique key, the server records it, and if the same key arrives again the server returns the original result instead of doing the work twice. In HTTP, GET, PUT, and DELETE are idempotent by definition and POST is not, which is exactly why POSTing a payment needs the key."},
  {id:"bf-6",level:2,q:"What is caching for in a backend service, and what are the hard parts?",a:"Caching stores the result of expensive work close to where it's needed so you don't redo it, cutting latency and load. The hard parts are all about staleness. The famous line is that cache invalidation is one of the two hard problems in computing, because the moment you cache something you've created a second copy of the truth that can drift from the source.||So the real skill is choosing an invalidation strategy, whether time-based expiry, explicit eviction on write, or versioned keys, that matches how tolerant the data is of being briefly wrong. For money data I cache very carefully or not at all, because a stale balance is worse than a slow one."},
  {id:"bf-7",level:3,q:"Walk me through concurrency problems in a request-handling service.",a:"The core issue is that many requests run at once and can touch the same data, so without care the final state depends on timing. The classic is read-modify-write: two requests both read a balance of 100, both add 10, both write 110, and one increment is lost.||The fixes are to make the database do the arithmetic atomically, or use optimistic locking with a version column so the second writer is rejected and retries, or pessimistic locking where you hold the row for the duration. At the service level I also keep handlers stateless so there's no shared mutable memory between requests, and I push operations that must be serialized, like changes to one account, through something that orders them, sometimes a queue keyed by account."},
  {id:"bf-8",level:3,q:"Why and when would you put a queue in front of work?",a:"A queue decouples accepting a request from doing the work, which buys three things. It absorbs bursts, so a spike becomes a backlog that drains at a steady rate instead of overwhelming a downstream system. It moves slow or unreliable work out of the request path, so the user gets a fast response. And it gives you retries and durability, because a message can be reprocessed if a worker crashes.||The costs are real: you've added infrastructure, the work is now asynchronous so the client can't assume it's done, and messages can arrive more than once, which loops right back to idempotency. So I add a queue when the work is slow, spiky, or must survive failure, not by default."},
 ]},
 {id:"node",name:"Node.js fundamentals",domain:"backend",slope:"climb",cards:[
  {id:"node-1",level:1,q:"What is the event loop, in your own words?",a:"Node runs your JavaScript on a single thread, and the event loop is what lets that single thread handle many things seemingly at once without blocking. Instead of waiting for a file read or a network call to finish, Node hands that operation off, keeps running other code, and comes back to your callback when it completes.||The loop is literally a cycle that checks several queues of ready callbacks, like timers and I/O callbacks, and runs them in phases. The one-sentence version is that Node is single-threaded for your code but delegates the waiting to the system, so it stays busy doing useful work instead of blocking."},
  {id:"node-2",level:2,q:"If Node is single-threaded, what happens if you do heavy CPU work in a handler?",a:"You block the entire event loop, so every other request is stuck behind that one computation, because there's only one thread running your JavaScript. This is Node's defining weakness, and it's the opposite of the I/O case: Node is brilliant at waiting on many things and terrible at grinding on one CPU-heavy thing.||The fixes move the heavy work off the main thread, whether a worker thread for CPU-bound work in-process, a separate service or a queue-and-worker setup for bigger jobs, or a native module for the hot path. The instinct I want is to recognize that a synchronous CPU loop in a request handler is a latent outage waiting for enough traffic."},
  {id:"node-3",level:2,q:"In Node, what's the difference between the microtask and macrotask queues?",a:"Macrotasks are things like timers and I/O callbacks; microtasks are promise callbacks and queueMicrotask. The rule that trips people up is that after each macrotask, Node drains the entire microtask queue before moving on. So a resolved promise's then runs before a setTimeout of zero, even though both look immediate.||This matters in practice because a flood of promise callbacks can starve I/O, since the loop keeps servicing microtasks and never reaches the next macrotask phase. Understanding the ordering is how you debug a service that mysteriously stops handling requests under a certain pattern of async work."},
  {id:"node-4",level:2,q:"What are streams and when do they save you?",a:"A stream processes data in chunks as it arrives instead of loading the whole thing into memory first. They save you whenever the data is large or unbounded, like reading a huge file, proxying an upload, or transforming a big CSV. The alternative, buffering the entire payload, works fine in testing with small data and then falls over in production when someone sends a gigabyte and the process runs out of memory.||Streams also support backpressure, the mechanism that lets a slow consumer tell a fast producer to slow down, so you don't pile up unread data. The mental model is a pipe you can transform in the middle, not a bucket you fill and then carry."},
  {id:"node-5",level:2,q:"How should errors be handled in async Node code?",a:"With async/await I wrap the await in try/catch, and I make sure every promise is either awaited or explicitly handled, because an unhandled rejection can crash the process. The subtle part is not swallowing errors: a catch that logs and continues can hide a real failure, so I catch where I can actually do something meaningful and otherwise let it propagate to a central handler.||For a web framework I keep one error-handling middleware at the edge that turns any error into a proper status and a safe response, so handlers can throw and trust it's caught. And I distinguish operational errors, like a failed downstream call I expect, from programmer errors like a bug, which I'd rather let crash and restart cleanly than limp along in a bad state."},
  {id:"node-6",level:3,q:"What's the risk with an uncaught exception or unhandled rejection?",a:"An uncaught exception leaves the process in an unknown state, because it unwound the stack past whatever invariants the code was maintaining, so continuing to serve requests risks corrupting data or serving garbage. The senior stance is that after an uncaught exception you log it and let the process exit, relying on a process manager or orchestrator to restart a fresh one, rather than catch-all and keep running.||Unhandled promise rejections are the async version of the same problem, and modern Node treats them as fatal by default for exactly this reason. The design implication is that the service should be stateless and restartable, so a crash is a blip rather than a disaster."},
  {id:"node-7",level:3,q:"How does the module system work, and what's the CommonJS versus ESM story?",a:"CommonJS is Node's original system, using require and module.exports, and it's synchronous, so a require blocks until the module is loaded and evaluated. ES modules are the standard, using import and export, and they're asynchronous and statically analyzable, which is what enables tree-shaking and top-level await.||The friction is that they don't mix seamlessly: ESM can import CommonJS fairly easily, but CommonJS can't simply require an ESM module because of the sync-versus-async mismatch, which is why you see dynamic import used as a bridge. For new code I default to ESM, but I stay aware of which mode a project and its dependencies are in, because the interop seams are a common source of confusing build and runtime errors."},
 ]},
 {id:"db",name:"Databases",domain:"backend",slope:"climb",cards:[
  {id:"db-1",level:1,q:"What does a database index do, and what's the cost of adding one?",a:"An index is a separate sorted structure, usually a B-tree, that lets the database find matching rows without scanning the whole table. It's the difference between flipping to a book's index and reading every page.||The cost is that every index has to be kept up to date on every insert, update, and delete, so indexes speed up reads while slowing writes and taking disk space. That's the tradeoff: you index the columns you filter and sort on often, and you don't index everything, because an over-indexed table is slow to write and wastes space."},
  {id:"db-2",level:2,q:"A SQL query is slow in production. Walk me through diagnosing it.",a:"I measure before touching anything, because the slow query is often not the one you'd guess. I run the query plan, EXPLAIN ANALYZE on Postgres, and read where the time goes, looking for a sequential scan over a big table where an index should be, or a step processing far more rows than the result needs.||The most common real cause I hit is the N plus one problem, where the code runs one query for a list and then one more per item in a loop, quietly firing hundreds of queries; the fix is to load the related data in one query or batch it. Beyond that the usual levers are an index matching how the query filters and sorts, sometimes composite, or a covering index so the database answers from the index without touching the table. The discipline is change one thing, measure again, confirm the plan actually improved."},
  {id:"db-3",level:2,q:"What's a composite database index, and why does column order matter?",a:"A composite index covers several columns in a specific order, and it works like a phone book sorted by last name then first name. It can efficiently answer a query filtering on the first column, or the first and second together, but not one filtering only on the second column, just as a phone book sorted by last name is useless if all you have is the first name.||So the order has to match your query patterns: put the column you always filter on first, and the more selective columns early. Getting the order wrong is a common reason an index exists but the planner ignores it."},
  {id:"db-4",level:2,q:"Explain ACID like you need to trust it with money.",a:"Atomicity means a transaction is all or nothing, so a transfer either fully happens or fully doesn't; you never leave money half-moved. Consistency means the database's invariants hold before and after, so a rule like 'balances can't go negative' isn't violated. Isolation means concurrent transactions don't corrupt each other, so two transfers at once don't interleave into a wrong balance. Durability means once it's committed, it survives a crash, so when the system says done, a power failure can't undo it.||That's why relational databases are the default for money: those four guarantees are exactly what a financial system can't do without."},
  {id:"db-5",level:3,q:"What are isolation levels and which would you pick for a payments write?",a:"Isolation levels trade correctness against concurrency. Read Committed, the common default, stops you reading uncommitted data but allows anomalies like a value changing between two reads in one transaction. Repeatable Read holds your reads stable but can still allow some write anomalies. Serializable is the strongest, guaranteeing the result is as if transactions ran one at a time, at the cost of more contention and possible retries.||For a payments write where correctness is everything, I lean toward the strongest level the workload can afford, often Serializable for the critical transaction, and I make the application retry on the serialization failures that come with it. In money code I'd rather pay in retries than in wrong balances."},
  {id:"db-6",level:2,q:"Optimistic versus pessimistic locking in a database?",a:"Pessimistic locking takes a lock on the row before you touch it, so nobody else can change it until you're done. It's safe but creates contention and can deadlock. Optimistic locking takes no lock; you read a version number and, when you write, assert the version hasn't changed, failing and retrying if it has.||Optimistic wins when conflicts are rare, which is most of the time, because it avoids lock overhead. Pessimistic wins when contention is high and retrying would be wasteful. For a payments row updated occasionally I'd usually go optimistic with a version column; for a hot counter everyone hits, I'd do the update atomically in the database instead."},
  {id:"db-7",level:3,q:"Design the core of a payments ledger. Key decisions.",a:"The core decision is that the ledger is append-only: I record immutable entries rather than overwriting a single mutable balance, and the current state is derived from the history. That gives the audit trail for free, because nothing is destroyed, only added.||I store money as integer minor units, never floating point. I put a unique constraint on the idempotency key for incoming requests, so a duplicate is refused by the database itself. I model money movement as double-entry, so every debit has a matching credit and the books always balance, which makes reconciliation natural. And I model the payment's status as explicit states with recorded transitions, so I can always see how it moved from pending to settled or failed. In a ledger, history is the product, so the schema is built to preserve it."},
  {id:"db-8",level:2,q:"SQL versus NoSQL. How do you actually decide?",a:"I start from the data and the access patterns, not the hype. A relational database is my default when the data is structured and relationships and consistency matter, which is most business and financial data, and it gives me transactions, joins, and a mature query language.||I reach for a document or key-value store when the shape is flexible or the scale and access pattern are simple and huge, like a cache, a session store, or a high-volume event log, where I don't need joins and I do need horizontal scale. For a payments system the answer is almost always relational, because ACID transactions and correctness are the whole point, and I'd use a NoSQL store alongside it for the things it's good at rather than as the system of record."},
 ]},
 {id:"bearch",name:"Backend architecture & general",domain:"backend",slope:"climb",cards:[
  {id:"ba-1",level:1,q:"How do you structure a service so it stays maintainable?",a:"I structure it in layers so each part has one job and the money logic never tangles with transport concerns. At the edge is a thin routing and controller layer that only accepts the request, validates its shape, and hands off.||Beneath that is a service layer holding the actual business logic, like how a fee is calculated or when a payment is allowed, and it knows nothing about HTTP. Beneath that is a data-access layer that owns how we talk to the database, so the service layer isn't writing queries inline. Validation happens right at the boundary, so nothing unvalidated reaches the business logic. The layers let me test the business logic in isolation and swap the edges without touching the core."},
  {id:"ba-2",level:2,q:"Monolith versus microservices. What's your honest take?",a:"Most teams should start with a well-structured monolith and split out services only when a real pressure forces it. A monolith is simpler to build, test, deploy, and reason about, and a lot of microservices pain is teams paying the distributed-systems tax, like network failures and cross-service consistency, before they had the scale or team size to need it.||Microservices earn their place when independent teams need to deploy independently, or when parts of the system have genuinely different scaling or reliability needs. The key insight is that clean module boundaries inside a monolith give most of the organizational benefit, and you can extract a service later along a boundary you've already drawn."},
  {id:"ba-3",level:2,q:"How do you make a service observable?",a:"I build for the moment something breaks at two in the morning and I have to understand it from the outside. That means three things working together. First, structured logging, so logs are machine-parseable records rather than free text, with every log line for a request carrying a correlation id so I can follow one request across services.||Second, distributed tracing, so I can see a request's whole journey and find where the time actually went, which is how you catch a slow downstream call behind a spike. Third, metrics and alerting on the signals that matter, like error rate, latency at the tail rather than the average, and throughput. In a payment system I'd add domain signals too, like the rate of failed charges, because a healthy server silently failing payments is still an incident."},
  {id:"ba-4",level:3,q:"What's the outbox pattern and what problem does it solve?",a:"The problem is the dual-write: you need to both save something to your database and tell another system about it, say by publishing an event, and if those are two separate steps either can fail, leaving the systems out of sync. The outbox pattern writes the event into an outbox table in the same database transaction as the business change, so they commit atomically, either both or neither.||A separate process then reads the outbox and publishes the events, marking them sent. It trades a little latency and machinery for the guarantee that you never save a payment without eventually emitting its event, which in a money system is exactly the guarantee you want."},
  {id:"ba-5",level:3,q:"How do you handle a downstream dependency that's slow or failing?",a:"I isolate the blast radius so one sick dependency doesn't take down the whole service. The tools are timeouts, so I never wait forever; retries with exponential backoff and jitter for transient failures, so I recover from a blip without stampeding; and a circuit breaker, which trips after repeated failures and fails fast for a while instead of piling requests onto something already down, then tests the water before closing again.||I also think about graceful degradation, whether I can serve a cached or partial result rather than an error, and about idempotency, because retries are only safe if the operation can be repeated. In a distributed system failure is normal, so resilience is a design input, not an afterthought."},
  {id:"ba-6",level:2,q:"What does a good CI/CD pipeline look like, and what are Terraform, CDK, and CloudFormation?",a:"A pipeline is the automated path from a commit to production, as stages that each pass before the next runs. On a pull request it lints, type-checks, and runs tests, so nothing obviously broken merges. On merge to main it builds the artifact, runs the fuller suite, and deploys, ideally to staging first and then production behind a gate. Shipping should be boring and repeatable rather than a manual ritual.||All three infra tools define your cloud as code instead of clicking a console, so environments are version-controlled and reproducible. CloudFormation is AWS's native templating in JSON or YAML. Terraform is the cloud-agnostic one from HashiCorp with its own configuration language. CDK, the Cloud Development Kit, lets you define AWS infrastructure in a real language like TypeScript and compiles down to CloudFormation."},
  {id:"ba-7",level:3,q:"How do you run a database schema migration with zero downtime?",a:"The core rule is that the running code and the schema have to be compatible at every instant, because during a rolling deploy old and new code run at the same time against one database. So I make migrations additive and multi-step rather than destructive in place.||To rename or drop a column I expand first, adding the new column and deploying code that writes to both and reads the new, then backfill the old data, then switch reads over, and only in a later release contract by removing the old column once nothing uses it. The outage-causing mistake is a destructive change, like dropping or renaming a column, in the same deploy as the code that depends on it, because for a moment the old code talks to the new schema. Expand, migrate, contract is the discipline."},
 ]},
 {id:"sysdesign",name:"System design & payments",domain:"sysdesign",slope:"climb",cards:[
  {id:"sd-1",level:1,q:"How do you approach an open-ended system design question?",a:"I slow down and scope before drawing anything, because the interviewer is testing how I think, not whether I can name technologies. First I clarify requirements and constraints: who uses it, how much traffic, what has to be consistent versus eventually consistent, the read-write ratio.||Then I sketch the high-level pieces and the data flow. Then I go deep where the interesting problem is, which they'll usually steer me toward. Throughout, I state my assumptions and tradeoffs out loud, because a design is a set of choices and the reasoning is the answer. And I try hard not to over-engineer: I build for the stated scale, not an imaginary one."},
  {id:"sd-2",level:2,q:"Design a payment processing engine that talks to an external processor.",a:"I design it around the reality that the external processor can be slow, fail, or answer twice. The first pillar is idempotency: every charge carries an idempotency key with a uniqueness constraint in the database, so a client retry charges exactly once. The second is an explicit state machine per payment, moving through created, pending, succeeded, and failed, with every transition recorded, so I can always explain where a payment is and how it got there.||Third is webhook handling: they arrive at least once and sometimes out of order, so I make handling idempotent and dedupe on the processor's event id. Fourth is retries with exponential backoff and jitter for transient failures. Fifth is reconciliation, a scheduled job comparing my records against the processor's, because drift is inevitable. I'd also use an outbox so recording a payment and emitting its event commit atomically, and keep card data out of scope with the processor's tokenization to shrink PCI exposure. In one line: assume the network and processor misbehave, make every operation safe to repeat and every state easy to explain."},
  {id:"sd-3",level:2,q:"How do you guarantee a customer is never double-charged?",a:"The guarantee has to live at the data layer, not just in careful code, because careful code loses races. So the charge carries an idempotency key, and there's a unique constraint on that key in the database; if a duplicate request arrives, the insert fails and I return the original result instead of charging again. That turns 'don't charge twice' from a hope into something the database enforces even under concurrent retries.||On top of that, the payment moves through an explicit state machine, so a charge already in a terminal state can't be re-executed. The layered answer is idempotency key, plus a database uniqueness constraint, plus a state machine, and it's layered because money bugs are exactly the ones you can't leave to chance."},
  {id:"sd-4",level:2,q:"What is reconciliation and why is it non-negotiable in payments?",a:"Reconciliation is a process, usually scheduled, that compares your own record of what happened against the payment processor's record and flags anything that doesn't match. It's non-negotiable because in a distributed money system, drift is inevitable: a webhook gets lost, a response times out after the processor already succeeded, a retry does something unexpected, and without reconciliation those discrepancies stay invisible until a customer or an auditor finds them.||The mindset is that you assume your view of the world will diverge from reality, so you build the thing that continuously detects and surfaces the divergence. It's the financial equivalent of double-entry bookkeeping catching an error because the two sides don't sum."},
  {id:"sd-5",level:3,q:"A webhook can arrive twice, out of order, or not at all. How do you design for that?",a:"I treat webhooks as unreliable hints I confirm, not commands I trust. For duplicates, I make handling idempotent by deduping on the processor's event id, so processing the same event twice is a no-op. For out-of-order, I don't assume the sequence; I look at the event's meaning against my current state and use the state machine to ignore a transition that doesn't make sense, or I fetch the authoritative status from the processor rather than inferring it from arrival order.||For never-at-all, I don't depend solely on the webhook: I have reconciliation and, where it matters, active polling to catch the payment whose notification got lost. The theme is that the webhook is a performance optimization over polling, and the system has to be correct even when the webhook lies or vanishes."},
  {id:"sd-6",level:2,q:"How do you scale reads on a database that's becoming a bottleneck?",a:"I go in order of cost and complexity. First, make sure the queries and indexes are right, because a lot of 'we need to scale' is really a missing index. Then add caching for hot, read-heavy data that tolerates slight staleness, which takes load straight off the database.||Then add read replicas and send reads to them while writes stay on the primary, accepting that replicas lag slightly so reads can be a beat behind. Only when a single primary genuinely can't hold the write volume do I consider sharding, splitting data across databases by a key, which is powerful but adds real complexity around cross-shard queries and transactions. The discipline is to exhaust the cheap wins before reaching for the expensive ones."},
  {id:"sd-7",level:3,q:"What does CAP mean for a payments system specifically?",a:"CAP says that when a network partition happens, meaning some nodes can't talk to others, a distributed system has to choose between staying consistent and staying available; it can't have both during the partition. For payments, consistency wins almost every time. I'd rather refuse to process a charge than process it against a stale or divergent view of an account and risk double-spending or a wrong balance.||So a payments core is typically built on a strongly consistent, CP-leaning store, and I accept reduced availability during a partition as the correct tradeoff. Where I can relax it is the non-critical read side: showing a slightly stale transaction history is fine, so the eventual-consistency tools get used at the edges, never on the money-moving path."},
 ]},
 {id:"testing",name:"Testing",domain:"testing",slope:"climb",cards:[
  {id:"t-1",level:1,q:"What should you actually test, and how do you think about the testing pyramid?",a:"The testing pyramid says have many fast unit tests at the base, fewer integration tests in the middle, and a small number of end-to-end tests at the top, because the higher you go the slower and more brittle tests get. The point isn't the exact ratio; it's that most of your confidence should come from fast tests that pin down behavior, and you reserve the expensive end-to-end tests for the critical paths a user actually walks.||I test behavior and public contracts rather than internal implementation, because tests coupled to implementation break every time you refactor even when nothing user-visible changed, and that trains people to distrust the suite. A test should fail when the behavior is wrong, not when the code merely moved."},
  {id:"t-2",level:1,q:"What's the difference between a unit test and an integration test, and when do you reach for each?",a:"A unit test exercises one piece in isolation, usually with its dependencies replaced, so it's fast and pinpoints exactly what broke. An integration test exercises several real pieces together, like your code plus the actual database, so it's slower but proves the wiring works.||I reach for unit tests for logic with many cases, like a fee calculation, because they let me cover edges cheaply. I reach for integration tests for the seams, like whether my code really talks to the database correctly, because that's exactly where unit tests with mocks can quietly lie to you. The rule of thumb is unit-test the hard logic and integration-test the wiring."},
  {id:"t-3",level:2,q:"What are mocks, stubs, and fakes, and what's the risk of over-mocking?",a:"They're all test doubles standing in for a real dependency. A stub returns canned answers. A mock also asserts it was called in a particular way. A fake is a lightweight working implementation, like an in-memory version of a database.||The risk of over-mocking is that your tests end up asserting how the code works rather than what it does, so they stay green while the real integration is broken, and they shatter on every refactor. My rule is to mock at the boundaries I don't control, like a third-party payment API, and use real implementations or fakes for the things I do control."},
  {id:"t-4",level:2,q:"How would you test a fee calculation or rules engine so you actually trust it?",a:"I start by making the logic pure, because a calculation that takes inputs and returns a result with no side effects is the easiest thing to test hard. Then I test in layers. The base is table-driven unit tests, many input-and-expected-output rows covering the ordinary cases and, more importantly, the edges: zero, the minimum, the maximum, a refund, a discount stacked on a discount, the rounding boundary where a half-cent has to go somewhere.||On top of that I like property-based testing for the invariants that must always hold, generating thousands of random cases to assert something like the sum of the split amounts always equals the total. Then a smaller set of integration tests exercises the real transactional path, including that charging twice with the same idempotency key only charges once. The layers give me breadth from generated cases and confidence in the real path."},
  {id:"t-5",level:3,q:"What is property-based testing and when is it worth it?",a:"Instead of writing specific examples, you state a property that must always hold and let the tool generate hundreds of random inputs trying to break it, using something like fast-check. It's worth it when there's an invariant you can express independent of any single input, like the sum of split amounts always equals the total, or that encoding then decoding returns the original value.||It shines in exactly the money and parsing code where the case you forgot is the one that bites. It's not a replacement for example tests; it's a net that catches the inputs you'd never think to write by hand."},
  {id:"t-6",level:2,q:"A test is flaky — it passes sometimes and fails sometimes. How do you deal with it?",a:"A flaky test is worse than no test, because it trains the team to ignore red, so I treat it as a real bug rather than noise. The usual causes are timing, like waiting a fixed number of milliseconds instead of waiting for a condition, shared state leaking between tests, or dependence on real time, network, or ordering.||The fix is to remove the nondeterminism: wait on the actual condition, isolate state so each test sets up and tears down its own, and control the clock and randomness instead of using the real ones. If I genuinely can't fix it fast, I quarantine it so it stops blocking everyone, but quarantine is a debt I pay down, not a parking lot I leave it in."},
  {id:"t-7",level:2,q:"What's your take on test-driven development?",a:"I use it as a tool, not a religion. Writing the test first is genuinely valuable when I'm unsure of the design or the logic is fiddly, because it forces me to define the behavior and the interface before I get lost in implementation, and it guarantees the code ends up testable. For obvious code or an exploratory spike I don't force it.||The deeper value people miss is that TDD is really a design pressure. If something is hard to test, that's usually the test telling me the design is too coupled, and I'd rather hear that early than after it's wired into everything."},
  {id:"t-8",level:1,q:"What makes a good test versus a bad one?",a:"A good test is fast, deterministic, and tells you clearly what broke when it fails. It checks one behavior, reads like a small specification of what the code should do, and doesn't depend on other tests or on hidden state.||A bad test is slow, flaky, or so coupled to implementation that any refactor turns it red without a real bug. The tell is what happens on failure: a good test points you at the problem, a bad one just says something changed. I optimize for tests I'll still trust in a year."},
 ]},
 {id:"aiflow",name:"AI-native workflow",domain:"ai",slope:"climb",cards:[
  {id:"ai-1",level:1,q:"How do AI coding tools actually fit into your day-to-day workflow?",a:"I use them as a fast, tireless pair, not as an author I hand the keyboard to. For boilerplate and mechanical refactors, like renaming a concept across a large codebase or converting a batch of components to a new pattern, I let the tool do the first pass and I review the diff, because that's where it saves the most time with the least risk.||For unfamiliar territory I use it to get oriented quickly, to ask what a module does or draft a function, and then I rewrite what it gives me so I actually understand it. And for tests I lean on it heavily, because a model is genuinely good at enumerating the cases a tired human forgets. The model I hold is that the tool accelerates my typing and recall, but the judgment about whether the code is correct and safe stays with me."},
  {id:"ai-2",level:2,q:"Where do you not trust AI-generated code, and how do you validate it before it ships?",a:"I trust it least exactly where this role lives, which is money logic and security. A model will happily produce a payment function that looks completely reasonable and is subtly wrong about a rounding rule or a refund edge case, and it looks so clean that it lowers your guard.||So my validation is layered. I read every line as if a junior engineer wrote it and I'm the reviewer, because that's really what it is. I make sure the change is covered by tests I understand and ideally wrote the intent for, so the tests check my specification, not the model's assumptions. For anything touching authentication, authorization, or a financial calculation, I slow all the way down and reason about it myself, because being fast and wrong there is far more expensive than being slower and right."},
  {id:"ai-3",level:2,q:"How do you review a pull request that's largely AI-generated?",a:"I review it exactly like human-written code, with one extra suspicion: AI code looks more confident than it is. It produces clean, plausible code that can be subtly wrong about an edge case or can quietly invent an API that doesn't exist.||So I check that it actually does what the ticket asked rather than something adjacent, I look hard at edge cases and error handling where models cut corners, and I verify any unfamiliar library call is real. The author owns it fully, whoever or whatever wrote it, and 'the AI wrote it' is never an explanation for a bug in review."},
  {id:"ai-4",level:2,q:"AI is great at generating tests. What's the catch?",a:"The catch is that a model will happily generate tests that assert whatever the current code already does, including its bugs, so they pass and prove nothing. Generated tests also cluster on the easy paths and skip the nasty edges unless you push.||So I use AI to draft coverage fast, which it's genuinely good at, but I supply the intent — I decide what correct means and which edges matter — and I read the assertions to make sure they test behavior I actually want rather than just pinning the current implementation in place. AI writes the tests; I own what they claim."},
  {id:"ai-5",level:3,q:"What are the real risks of leaning on AI tools in a regulated codebase, and how do you manage them?",a:"There are three real risks. First, subtle correctness bugs in money or logic that look fine and pass a glance, which I manage by keeping a human firmly in the loop on high-stakes code and never letting AI output reach a financial path unreviewed. Second, security and data leakage, both AI-suggested code carrying a vulnerability and the question of what proprietary code gets sent to a tool, which I manage by validating security-sensitive code myself and following the org's rules on approved tooling.||Third, skill erosion and over-trust across the team, where people stop reasoning and start pasting, which I manage in how I mentor. The through-line is that the tool changes how fast I work, not who's accountable for the result."},
  {id:"ai-6",level:2,q:"How would you mentor an engineer on using AI tools well and safely?",a:"I'd focus on judgment rather than tricks, because the tools change every few months but the judgment doesn't. The first thing I teach is that they own everything they commit, no matter what wrote it, so the reviewer standard applies to their own AI output.||Then I'd show them where the leverage actually is, which is boilerplate, refactors, and tests, and where the danger is, which is anything touching money, auth, or data integrity. I'd pair with them on a real change and think out loud, so they hear the moment I stop trusting the tool and start reasoning for myself, because that instinct is the whole skill. And I'd make it normal on the team to say when a model led you down a wrong path, so people share the failure modes instead of hitting them one at a time."},
 ]},
 {id:"rag",name:"RAG & vector databases",domain:"ai",slope:"climb",cards:[
  {id:"rag-1",level:1,q:"What is retrieval-augmented generation, and what problem does it solve?",a:"Retrieval-augmented generation, or RAG, is the pattern where, instead of hoping a language model already knows your specific information, you retrieve the relevant documents at question time and hand them to the model as context, so its answer is grounded in your actual data.||It matters because it lets the model answer about private or fast-changing information it was never trained on, and it makes the answer traceable back to a source, which in a regulated setting is a real advantage. The short version is that you're giving the model an open book instead of testing it from memory."},
  {id:"rag-2",level:2,q:"When does a vector database earn its place, and when is it overkill?",a:"A vector database earns its place as the retrieval step: you convert your documents into embeddings, which are numerical representations of meaning, and it finds the ones closest in meaning to the question rather than matching exact keywords.||So it's worth it when you need search by meaning over a large body of text, where a user might ask in words that don't appear in the document. It's overkill when a plain keyword search or a normal database query would already find the right record, because then you've added infrastructure and complexity for a problem you didn't have."},
  {id:"rag-3",level:1,q:"What's an embedding, in plain terms?",a:"An embedding turns a piece of text into a list of numbers that captures its meaning, so that things which mean similar things end up close together in that numeric space.||That closeness is what lets a search find a document about canceling a payment when you asked about stopping a charge, even with no shared words, because the meanings sit near each other. You generate embeddings with a model, store them, and compare them by distance. The one-line version is that an embedding is meaning turned into coordinates."},
  {id:"rag-4",level:2,q:"Why does chunking matter in a RAG pipeline?",a:"Chunking is how you split documents before embedding them, and it quietly decides how good your retrieval is. Chunks too large and each one covers several topics, so the match is fuzzy and you stuff the model with irrelevant text. Chunks too small and you shed the surrounding context that made a passage meaningful.||So I size chunks to a coherent unit of meaning, often with a little overlap so an idea that spans a boundary isn't cut in half. It's unglamorous, but retrieval quality lives or dies here more than on the fancier parts of the pipeline."},
  {id:"rag-5",level:2,q:"How does RAG help with hallucination, and does it eliminate it?",a:"RAG reduces hallucination by grounding the model in retrieved source text, so instead of answering from vague memory it answers from documents you put in front of it, and you can cite the source.||But it doesn't eliminate hallucination. The model can still misread the context, blend it with its own priors, or answer confidently when retrieval brought back nothing relevant. So the honest framing is that RAG makes answers more grounded and more checkable, not guaranteed true, and for anything high-stakes you keep the citation and a human check."},
  {id:"rag-6",level:3,q:"RAG versus fine-tuning — how do you decide?",a:"They solve different problems. RAG gives the model knowledge at question time, so it's the right tool when the information changes, is large, or needs to be traceable to a source, and it's cheaper to keep current because you just update the documents. Fine-tuning changes the model's behavior or style, so it's the tool when you want it to respond consistently in a certain format or master a narrow task, not when you're chasing fresh facts.||For most business cases that sound like 'answer questions about our data,' RAG is the default, and I'd reach for fine-tuning to shape how it answers rather than what it knows. They also compose: fine-tune for behavior, retrieve for knowledge."},
 ]},
];

const ALL = [];
BANK.forEach(cat => cat.cards.forEach(c => ALL.push(Object.assign({}, c, {catId:cat.id, catName:cat.name, domain:cat.domain, slope:cat.slope}))));
const CAT = {}; BANK.forEach(c => CAT[c.id]=c);
const KEY="interview_drill_v1", PKEY="interview_drill_profile_v1", DAY=86400000, INT={1:0,2:DAY,3:3*DAY,4:7*DAY,5:16*DAY};

/* ---------------- state ---------------- */
let progress = {};
let profile = {name:"", skipped:false};
let memoryOnly = false;
let view="home", scope={type:"domain",value:"all"}, card=null, revealed=false;
let session={g:0,y:0,r:0}, recent=[];
const COOLDOWN=6;

function storageOK(){ try{ const k="__id_test"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; }catch(e){ return false; } }
function load(){
  memoryOnly=!storageOK(); if(memoryOnly) return;
  try{ const v=localStorage.getItem(KEY); if(v) progress=JSON.parse(v); }catch(e){}
  try{ const p=localStorage.getItem(PKEY); if(p) profile=Object.assign(profile, JSON.parse(p)); }catch(e){}
  migrate();
}
// older saves stored only the latest grade; seed the lifetime tallies from it so history isn't lost
function migrate(){
  let changed=false;
  Object.keys(progress).forEach(id=>{
    const s=progress[id]; if(!s||typeof s!=="object") return;
    if(s.g===undefined&&s.y===undefined&&s.r===undefined){
      s.g=0; s.y=0; s.r=0;
      if(s.seen&&(s.grade==="g"||s.grade==="y"||s.grade==="r")) s[s.grade]=1;
      changed=true;
    }
  });
  if(changed) persist();
}
function persist(){ if(memoryOnly) return; try{ localStorage.setItem(KEY, JSON.stringify(progress)); }catch(e){} }
function persistProfile(){ if(memoryOnly) return; try{ localStorage.setItem(PKEY, JSON.stringify(profile)); }catch(e){} }
function resetAll(){ progress={}; try{ localStorage.removeItem(KEY);}catch(e){} render(); }

function poolFor(sc){
  if(sc.type==="category") return ALL.filter(c=>c.catId===sc.value);
  if(sc.value==="all") return ALL;
  return ALL.filter(c=>c.domain===sc.value);
}
function st(c){ return progress[c.id]||{box:1,seen:false,last:0,grade:null,g:0,y:0,r:0}; }
function orderUnseen(arr, sc){
  const mixed = sc.type==="domain" && sc.value==="all";
  return arr.slice().sort((a,b)=>{
    const ka = mixed ? a.level : (a.slope==="deep" ? -a.level : a.level);
    const kb = mixed ? b.level : (b.slope==="deep" ? -b.level : b.level);
    return (ka-kb) || (Math.random()-0.5);
  });
}
function pickFrom(arr, orderer){
  let a = arr.filter(c=>!recent.includes(c.id));
  if(a.length===0) a = arr.slice();
  return orderer(a)[0];
}
function pickNext(sc){
  const now=Date.now();
  const pool=poolFor(sc);
  const unseen=[], due=[], rest=[];
  pool.forEach(c=>{ const s=st(c);
    if(!s.seen) unseen.push(c);
    else if(now>=s.last+(INT[s.box]||0)) due.push(c);
    else rest.push(c);
  });
  // breadth first: unseen cards before any resurfaced ones, so Random walks the whole bank
  if(unseen.length) return pickFrom(unseen, a=>orderUnseen(a,sc));
  if(due.length)    return pickFrom(due,  a=>a.slice().sort((x,y)=>st(x).box-st(y).box||st(x).last-st(y).last));
  if(rest.length)   return pickFrom(rest, a=>a.slice().sort((x,y)=>st(x).last-st(y).last));
  return pool[0];
}
function serve(sc){ const c=pickNext(sc); if(c){ recent.push(c.id); if(recent.length>COOLDOWN) recent.shift(); } return c; }
function startDrill(sc){ scope=sc; recent=[]; session={g:0,y:0,r:0}; card=serve(sc); revealed=false; view="drill"; render(); }
function grade(gk){
  if(!card) return;
  const cur=st(card);
  const next={box:GRADE[gk].box(cur.box), seen:true, last:Date.now(), grade:gk,
              g:cur.g||0, y:cur.y||0, r:cur.r||0};
  next[gk]++;
  progress[card.id]=next;
  persist();
  session[gk]++;
  card=serve(scope); revealed=false; render();
}
function stats(){
  const out={};
  BANK.forEach(cat=>{ let nw=0,r=0,y=0,g=0,m=0;
    cat.cards.forEach(c=>{ const s=progress[c.id]; if(!s||!s.seen){nw++;return;} if(s.box>=4)m++; if(s.grade==="r")r++; else if(s.grade==="y")y++; else g++; });
    out[cat.id]={total:cat.cards.length,nw,r,y,g,mastered:m};
  }); return out;
}
function overall(){ let seen=0,m=0; ALL.forEach(c=>{const s=progress[c.id]; if(s&&s.seen)seen++; if(s&&s.box>=4)m++;}); return {total:ALL.length,seen,mastered:m}; }
// every rating you've ever given, counted each time — the running history
function lifetime(){
  let g=0,y=0,r=0;
  Object.keys(progress).forEach(id=>{ const s=progress[id]; if(!s||typeof s!=="object") return; g+=s.g||0; y+=s.y||0; r+=s.r||0; });
  return {g,y,r,total:g+y+r};
}
// where each card stands right now, counted once by its most recent rating
function standing(){
  let g=0,y=0,r=0,nw=0;
  ALL.forEach(c=>{ const s=progress[c.id];
    if(!s||!s.seen){nw++;return;}
    if(s.grade==="r")r++; else if(s.grade==="y")y++; else g++;
  });
  return {g,y,r,nw};
}
function lastDrilled(){ let t=0; Object.keys(progress).forEach(id=>{ const s=progress[id]; if(s&&s.last>t)t=s.last; }); return t; }
function ago(t){
  if(!t) return "never";
  const d=Date.now()-t, mins=Math.floor(d/60000), hrs=Math.floor(d/3600000), days=Math.floor(d/86400000);
  if(mins<1) return "just now";
  if(mins<60) return mins+(mins===1?" minute ago":" minutes ago");
  if(hrs<24) return hrs+(hrs===1?" hour ago":" hours ago");
  return days+(days===1?" day ago":" days ago");
}

/* ---------------- render ---------------- */
const root=document.getElementById("root");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const escAttr=s=>esc(s).replace(/"/g,"&quot;");
function seg(n,color,dim){ return n?`<div style="flex:${n};background:${color};opacity:${dim?.45:1};height:100%"></div>`:""; }

function render(){
  root.innerHTML = view==="name" ? nameHTML() : (view==="home" ? homeHTML() : drillHTML());
  wire();
  if(view==="name"){ const i=root.querySelector("#nameInput"); if(i) i.focus(); }
}

function nameHTML(){
  const editing=!!profile.name;
  return `
  <div class="nameWrap">
    <div class="eyebrow">SENIOR FULL-STACK · INTERVIEW DRILL</div>
    <h1>${editing?"Change your name":"What should I call you?"}</h1>
    <p class="lede">Your name sits on the scorecard at the bottom of the home screen, next to your all-time nailed, shaky, and missed totals.</p>
    <input class="nameInput" id="nameInput" type="text" maxlength="24" placeholder="Your name"
      value="${escAttr(profile.name||"")}" autocomplete="off" autocapitalize="words" spellcheck="false" />
    <div class="nameActions">
      <button class="revealBtn" id="saveName">${editing?"Save":"Start drilling"}</button>
      ${editing?`<button class="ghost" id="cancelName">Cancel</button>`
               :`<button class="ghost" id="skipName">Skip for now</button>`}
    </div>
  </div>`;
}

function homeHTML(){
  const s=stats(), o=overall();
  const sec=(title,dom)=>{
    const cats=BANK.filter(c=>c.domain===dom);
    return `<div class="sectionLabel">${title}</div><div style="display:grid;gap:10px">`+
      cats.map(cat=>{ const x=s[cat.id]; return `
      <button class="catCard" data-cat="${cat.id}">
        <div class="catHead"><span class="n">${cat.name}</span><span class="c">${x.total} cards</span></div>
        <div class="gapBar">
          ${seg(x.mastered,C.green)}${seg(Math.max(0,x.g-x.mastered),C.green,true)}${seg(x.y,C.amber)}${seg(x.r,C.red)}${seg(x.nw,C.border)}
        </div>
      </button>`; }).join("")+`</div>`;
  };
  const mPct=(o.mastered/o.total)*100, sPct=((o.seen-o.mastered)/o.total)*100;
  return `
  <div class="eyebrow">SENIOR FULL-STACK · INTERVIEW DRILL</div>
  <h1>Answer out loud. Then reveal.</h1>
  <p class="lede">Say your whole answer before you reveal the model answer — that's the practice. Grade yourself honestly and the tool keeps resurfacing what you miss and retires what you know.</p>
  <div style="margin-top:20px">
    <span class="mono" style="font-size:12px;color:var(--muted)">${o.seen}/${o.total} attempted · ${o.mastered} mastered</span>
    <div class="meterTrack"><div style="height:100%;width:${mPct}%;background:${C.green}"></div><div style="height:100%;width:${sPct}%;background:${C.accent};opacity:.5"></div></div>
  </div>
  <button class="randomBtn" data-dom="all"><span class="t">Random</span><span class="s">everything, mixed — the real interview simulation</span></button>
  <div class="focusChips">
    <button class="chipBtn" data-dom="frontend">Frontend</button>
    <button class="chipBtn" data-dom="backend">Backend</button>
    <button class="chipBtn" data-dom="sysdesign">System design</button>
    <button class="chipBtn" data-dom="ai">AI-native</button>
    <button class="chipBtn" data-dom="testing">Testing</button>
  </div>
  ${sec("Frontend","frontend")}
  ${sec("Backend","backend")}
  ${sec("System design & payments","sysdesign")}
  ${sec("AI-native practice","ai")}
  ${sec("Testing","testing")}
  ${scoreCardHTML(o)}
  <div style="margin-top:26px" id="resetWrap"><button class="ghost" id="resetBtn">Reset progress</button></div>
  ${memoryOnly
    ? `<div class="note">This copy is running somewhere that blocks local storage — likely inside Claude — so ratings last only for this session. Save the file and open it in your own browser to keep your progress across sessions.</div>`
    : `<div class="note">Your progress is saved in this browser on this device. Close it and open the file again and it remembers your ratings.</div>`}
  `;
}

function scoreCardHTML(o){
  const lt=lifetime(), sd=standing();
  return `
  <div class="sectionLabel">Scorecard</div>
  <div class="scoreCard">
    <div class="scoreHead">
      <span class="scoreName">${profile.name?esc(profile.name):"No name set"}</span>
      <button class="editName" id="editName">${profile.name?"EDIT NAME":"ADD YOUR NAME"}</button>
    </div>
    <div class="scoreGrid">
      <div class="scoreCell"><div class="num" style="color:${C.green}">${lt.g}</div><div class="lbl">nailed</div></div>
      <div class="scoreCell"><div class="num" style="color:${C.amber}">${lt.y}</div><div class="lbl">shaky</div></div>
      <div class="scoreCell"><div class="num" style="color:${C.red}">${lt.r}</div><div class="lbl">missed</div></div>
    </div>
    <div class="scoreFoot">
      ${lt.total} ${lt.total===1?"rating":"ratings"} all time · ${o.seen}/${o.total} cards attempted · ${o.mastered} mastered<br/>
      standing now · <span style="color:${C.green}">${sd.g} nailed</span> · <span style="color:${C.amber}">${sd.y} shaky</span> · <span style="color:${C.red}">${sd.r} missed</span> · ${sd.nw} untouched<br/>
      last drilled · ${ago(lastDrilled())}
    </div>
  </div>`;
}

function drillHTML(){
  if(!card) return `<div style="text-align:center;padding-top:60px"><div style="font-size:18px;margin-bottom:8px">No cards in this set.</div><button class="ghost" id="backBtn">Back</button></div>`;
  const domName={all:"Random · all topics",frontend:"Frontend",backend:"Backend",sysdesign:"System design & payments",ai:"AI-native",testing:"Testing"};
  const scopeLabel = scope.type==="category"?CAT[scope.value].name:(domName[scope.value]||"Drill");
  const lvl={1:"fundamentals",2:"core",3:"hard"}[card.level];
  const s=progress[card.id];
  const lastChip = s&&s.grade?`<span class="chip" style="border-color:transparent;color:${GRADE[s.grade].color}">last: ${GRADE[s.grade].label.toLowerCase()}</span>`:``;
  const answer = `<div class="aCard"><div class="qLabel" style="color:var(--accent)">MODEL ANSWER</div>`+
    card.a.split("||").map(p=>`<p>${esc(p)}</p>`).join("")+`</div>
    <div class="gradePrompt">How close was your spoken answer?</div>
    <div class="gradeRow">
      <button class="gradeBtn" data-grade="r" style="border-color:${C.red};color:${C.red}"><span class="l">Missed it</span><span class="h">1</span></button>
      <button class="gradeBtn" data-grade="y" style="border-color:${C.amber};color:${C.amber}"><span class="l">Shaky</span><span class="h">2</span></button>
      <button class="gradeBtn" data-grade="g" style="border-color:${C.green};color:${C.green}"><span class="l">Nailed it</span><span class="h">3</span></button>
    </div>`;
  const gate = `<div class="gate"><div class="gateHint">Say your full answer out loud first — subject, verb, all of it — as if you were in the room.</div>
    <button class="revealBtn" id="revealBtn">Reveal model answer</button><div class="kb">space / enter</div></div>`;
  return `
  <div class="drillTop">
    <button class="back" id="backBtn">← topics</button>
    <div class="tele"><span style="color:${C.green}">${session.g} nailed</span><span style="color:${C.amber}">${session.y} shaky</span><span style="color:${C.red}">${session.r} missed</span></div>
  </div>
  <div class="chips">
    <span class="chip">${scopeLabel}</span>
    <span class="chip" style="color:var(--faint)">${card.catName}</span>
    <span class="chip" style="border-color:transparent;color:${card.level===3?C.amber:C.faint}">${lvl}</span>
    ${lastChip}
  </div>
  <div class="qCard"><div class="qLabel">QUESTION</div><div class="qText">${esc(card.q)}</div></div>
  ${revealed?answer:gate}
  `;
}

/* ---------------- wiring ---------------- */
function wire(){
  root.querySelectorAll("[data-dom]").forEach(b=>b.onclick=()=>startDrill({type:"domain",value:b.dataset.dom}));
  root.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>startDrill({type:"category",value:b.dataset.cat}));
  const rb=root.querySelector("#revealBtn"); if(rb) rb.onclick=()=>{revealed=true;render();};
  root.querySelectorAll("[data-grade]").forEach(b=>b.onclick=()=>grade(b.dataset.grade));
  const bk=root.querySelector("#backBtn"); if(bk) bk.onclick=()=>{view="home";render();};
  const en=root.querySelector("#editName"); if(en) en.onclick=()=>{view="name";render();};
  const sv=root.querySelector("#saveName"); if(sv) sv.onclick=()=>{
    const i=root.querySelector("#nameInput"), v=(i.value||"").trim();
    if(!v){ i.focus(); return; }
    profile.name=v; profile.skipped=false; persistProfile(); view="home"; render();
  };
  const sk=root.querySelector("#skipName"); if(sk) sk.onclick=()=>{ profile.skipped=true; persistProfile(); view="home"; render(); };
  const cn=root.querySelector("#cancelName"); if(cn) cn.onclick=()=>{ view="home"; render(); };
  const ni=root.querySelector("#nameInput"); if(ni) ni.onkeydown=e=>{
    if(e.key==="Enter"){ e.preventDefault(); const b=root.querySelector("#saveName"); if(b) b.click(); }
  };
  const reset=root.querySelector("#resetBtn"); if(reset) reset.onclick=()=>{
    const w=root.querySelector("#resetWrap");
    w.innerHTML=`<span style="color:var(--muted);font-size:13px;margin-right:10px">Erase all ratings?</span>
      <button class="ghost" id="yesReset" style="color:${C.red};border-color:${C.red}">Yes, reset</button>
      <button class="ghost" id="noReset" style="margin-left:8px">Cancel</button>`;
    root.querySelector("#yesReset").onclick=resetAll;
    root.querySelector("#noReset").onclick=()=>render();
  };
}
window.addEventListener("keydown",e=>{
  if(view!=="drill") return;
  if(!revealed && (e.key===" "||e.key==="Enter")){ e.preventDefault(); revealed=true; render(); }
  else if(revealed){ if(e.key==="1")grade("r"); if(e.key==="2")grade("y"); if(e.key==="3")grade("g"); }
});

load();
if(!profile.name && !profile.skipped) view="name";
render();
</script>
</body>
</html>
