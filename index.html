const ALL = [];
BANK.forEach(cat => cat.cards.forEach(c => ALL.push(Object.assign({}, c, {catId:cat.id, catName:cat.name, domain:cat.domain, slope:cat.slope}))));
const CAT = {}; BANK.forEach(c => CAT[c.id]=c);
const KEY="interview_drill_v1", PKEY="interview_drill_profile_v1", SKEY="interview_drill_session_v1", VKEY="interview_drill_content_version", DAY=86400000, INT={1:0,2:DAY,3:3*DAY,4:7*DAY,5:16*DAY};
// bump when the card bank's questions/IDs change materially, so stale ratings on reused IDs don't misattach to unrelated new questions
const CONTENT_VERSION="373-v1";

/* ---------------- state ---------------- */
let progress = {};
let profile = {name:"", skipped:false};
let memoryOnly = false;
let view="home", scope={type:"domain",value:"all"}, card=null, revealed=false, pendingNote=null;
let session={g:0,y:0,r:0}, recent=[];
let savedSession=null;
const COOLDOWN=6;

function storageOK(){ try{ const k="__id_test"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; }catch(e){ return false; } }
function load(){
  memoryOnly=!storageOK(); if(memoryOnly) return;
  try{
    if(localStorage.getItem(VKEY)!==CONTENT_VERSION){
      // the card bank changed shape (new/reused IDs) -- wipe ratings and the resumable session so old
      // grades don't silently reattach to unrelated new questions. the name is kept, it isn't tied to content.
      localStorage.removeItem(KEY); localStorage.removeItem(SKEY);
      localStorage.setItem(VKEY, CONTENT_VERSION);
    }
  }catch(e){}
  try{ const v=localStorage.getItem(KEY); if(v) progress=JSON.parse(v); }catch(e){}
  try{ const p=localStorage.getItem(PKEY); if(p) profile=Object.assign(profile, JSON.parse(p)); }catch(e){}
  try{ const sv=localStorage.getItem(SKEY); if(sv) savedSession=JSON.parse(sv); }catch(e){}
  migrate();
}
// older saves stored only the latest grade; seed the lifetime tallies from it so history isn't lost
function migrate(){
  let changed=false;
  Object.keys(progress).forEach(id=>{
    const s=progress[id]; if(!s||typeof s!=="object") return;
    if(s.g===undefined&&s.y===undefined&&s.r===undefined){
      s.g=0; s.y=0; s.r=0;
      if(s.seen&&(s.grade==="g"||s.grade==="y"||s.grade==="r")) s[s.grade]=1;
      changed=true;
    }
  });
  if(changed) persist();
}
function persist(){ if(memoryOnly) return; try{ localStorage.setItem(KEY, JSON.stringify(progress)); }catch(e){} }
function persistProfile(){ if(memoryOnly) return; try{ localStorage.setItem(PKEY, JSON.stringify(profile)); }catch(e){} }
// tracks where you are mid-drill so an accidental reload resumes instead of dumping you back to topics
function persistSession(){
  if(memoryOnly) return;
  try{
    if(view==="drill" && card) localStorage.setItem(SKEY, JSON.stringify({scope, cardId:card.id, session}));
    else localStorage.removeItem(SKEY);
  }catch(e){}
}
function resetAll(){
  progress={}; profile={name:"",skipped:false}; card=null; revealed=false; pendingNote=null;
  try{ localStorage.removeItem(KEY); localStorage.removeItem(PKEY); localStorage.removeItem(SKEY); }catch(e){}
  view="name"; render();
}

const isCore=catId=>catId.indexOf("core-")===0;
function poolFor(sc){
  if(sc.type==="category") return ALL.filter(c=>c.catId===sc.value);
  if(sc.type==="core") return ALL.filter(c=>isCore(c.catId));
  if(sc.value==="all") return ALL;
  return ALL.filter(c=>c.domain===sc.value && !isCore(c.catId));
}
function st(c){ return progress[c.id]||{box:1,seen:false,last:0,grade:null,g:0,y:0,r:0}; }
function orderUnseen(arr, sc){
  const mixed = sc.type==="domain" && sc.value==="all";
  return arr.slice().sort((a,b)=>{
    const ka = mixed ? a.level : (a.slope==="deep" ? -a.level : a.level);
    const kb = mixed ? b.level : (b.slope==="deep" ? -b.level : b.level);
    return (ka-kb) || (Math.random()-0.5);
  });
}
function pickFrom(arr, orderer){
  let a = arr.filter(c=>!recent.includes(c.id));
  if(a.length===0) a = arr.slice();
  return orderer(a)[0];
}
function pickNext(sc){
  const now=Date.now();
  const pool=poolFor(sc);
  const unseen=[], due=[], rest=[];
  pool.forEach(c=>{ const s=st(c);
    if(!s.seen) unseen.push(c);
    else if(now>=s.last+(INT[s.box]||0)) due.push(c);
    else rest.push(c);
  });
  // breadth first: unseen cards before any resurfaced ones, so Random walks the whole bank
  if(unseen.length) return pickFrom(unseen, a=>orderUnseen(a,sc));
  if(due.length)    return pickFrom(due,  a=>a.slice().sort((x,y)=>st(x).box-st(y).box||st(x).last-st(y).last));
  if(rest.length)   return pickFrom(rest, a=>a.slice().sort((x,y)=>st(x).last-st(y).last));
  return pool[0];
}
function serve(sc){ const c=pickNext(sc); if(c){ recent.push(c.id); if(recent.length>COOLDOWN) recent.shift(); } return c; }
function startDrill(sc){ scope=sc; recent=[]; session={g:0,y:0,r:0}; card=serve(sc); revealed=false; pendingNote=null; view="drill"; persistSession(); render(); }
function grade(gk){
  if(!card || pendingNote) return; // a note is already pending on this card -- wait for Continue instead of re-grading it
  const cur=st(card);
  const next={box:GRADE[gk].box(cur.box), seen:true, last:Date.now(), grade:gk,
              g:cur.g||0, y:cur.y||0, r:cur.r||0};
  next[gk]++;
  progress[card.id]=next;
  persist();
  session[gk]++;
  persistSession(); // keep the resume snapshot's tally current even while a note pane holds on this card
  if(card.note){ pendingNote=card.note; render(); }
  else advance();
}
// moves to the next card; called directly when a card has no practice note, or from the Continue button once it's been read
function advance(){
  pendingNote=null;
  card=serve(scope); revealed=false; persistSession(); render();
}
function stats(){
  const out={};
  BANK.forEach(cat=>{ let nw=0,r=0,y=0,g=0,m=0;
    cat.cards.forEach(c=>{ const s=progress[c.id]; if(!s||!s.seen){nw++;return;} if(s.box>=4)m++; if(s.grade==="r")r++; else if(s.grade==="y")y++; else g++; });
    out[cat.id]={total:cat.cards.length,nw,r,y,g,mastered:m};
  }); return out;
}
function overall(){ let seen=0,m=0; ALL.forEach(c=>{const s=progress[c.id]; if(s&&s.seen)seen++; if(s&&s.box>=4)m++;}); return {total:ALL.length,seen,mastered:m}; }
// every rating you've ever given, counted each time — the running history
function lifetime(){
  let g=0,y=0,r=0;
  Object.keys(progress).forEach(id=>{ const s=progress[id]; if(!s||typeof s!=="object") return; g+=s.g||0; y+=s.y||0; r+=s.r||0; });
  return {g,y,r,total:g+y+r};
}
// where each card stands right now, counted once by its most recent rating
function standing(){
  let g=0,y=0,r=0,nw=0;
  ALL.forEach(c=>{ const s=progress[c.id];
    if(!s||!s.seen){nw++;return;}
    if(s.grade==="r")r++; else if(s.grade==="y")y++; else g++;
  });
  return {g,y,r,nw};
}
function lastDrilled(){ let t=0; Object.keys(progress).forEach(id=>{ const s=progress[id]; if(s&&s.last>t)t=s.last; }); return t; }
function ago(t){
  if(!t) return "never";
  const d=Date.now()-t, mins=Math.floor(d/60000), hrs=Math.floor(d/3600000), days=Math.floor(d/86400000);
  if(mins<1) return "just now";
  if(mins<60) return mins+(mins===1?" minute ago":" minutes ago");
  if(hrs<24) return hrs+(hrs===1?" hour ago":" hours ago");
  return days+(days===1?" day ago":" days ago");
}

/* ---------------- render ---------------- */
const root=document.getElementById("root");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const escAttr=s=>esc(s).replace(/"/g,"&quot;");
function seg(n,color,dim){ return n?`<div style="flex:${n};background:${color};opacity:${dim?.45:1};height:100%"></div>`:""; }

function render(){
  root.innerHTML = view==="name" ? nameHTML() : (view==="home" ? homeHTML() : drillHTML());
  wire();
  if(view==="name"){ const i=root.querySelector("#nameInput"); if(i) i.focus(); }
}

function nameHTML(){
  const editing=!!profile.name;
  return `
  <div class="nameWrap">
    <div class="eyebrow">SENIOR FULL-STACK · INTERVIEW DRILL</div>
    <h1>${editing?"Change your name":"What should I call you?"}</h1>
    <p class="lede">Your name sits on the scorecard at the bottom of the home screen, next to your all-time nailed, shaky, and missed totals.</p>
    <input class="nameInput" id="nameInput" type="text" maxlength="24" placeholder="Your name"
      value="${escAttr(profile.name||"")}" autocomplete="off" autocapitalize="words" spellcheck="false" />
    <div class="nameActions">
      <button class="revealBtn" id="saveName">${editing?"Save":"Start drilling"}</button>
      ${editing?`<button class="ghost" id="cancelName">Cancel</button>`
               :`<button class="ghost" id="skipName">Skip for now</button>`}
    </div>
  </div>`;
}

function homeHTML(){
  const s=stats(), o=overall();
  const sec=(title,dom)=>{
    const cats=BANK.filter(c=>c.domain===dom && !isCore(c.id));
    if(!cats.length) return "";
    return `<div class="sectionLabel">${title}</div><div style="display:grid;gap:10px">`+
      cats.map(cat=>{ const x=s[cat.id]; return `
      <button class="catCard" data-cat="${cat.id}">
        <div class="catHead"><span class="n">${cat.name}</span><span class="c">${x.total} cards</span></div>
        <div class="gapBar">
          ${seg(x.mastered,C.green)}${seg(Math.max(0,x.g-x.mastered),C.green,true)}${seg(x.y,C.amber)}${seg(x.r,C.red)}${seg(x.nw,C.border)}
        </div>
      </button>`; }).join("")+`</div>`;
  };
  const coreCats=BANK.filter(c=>isCore(c.id));
  const coreTotal=coreCats.reduce((n,c)=>n+c.cards.length,0);
  const essentials=`
  <div class="sectionLabel">Essentials · quick practice</div>
  <button class="randomBtn" data-core="1"><span class="t">Essentials random</span><span class="s">${coreTotal} condensed questions across every topic — the fast pass</span></button>
  <div style="display:grid;gap:10px;margin-top:10px">`+
    coreCats.map(cat=>{ const x=s[cat.id]; return `
    <button class="catCard" data-cat="${cat.id}">
      <div class="catHead"><span class="n">${cat.name.replace(/^Core Track — /,"")}</span><span class="c">${x.total} cards</span></div>
      <div class="gapBar">
        ${seg(x.mastered,C.green)}${seg(Math.max(0,x.g-x.mastered),C.green,true)}${seg(x.y,C.amber)}${seg(x.r,C.red)}${seg(x.nw,C.border)}
      </div>
    </button>`; }).join("")+`</div>`;
  const mPct=(o.mastered/o.total)*100, sPct=((o.seen-o.mastered)/o.total)*100;
  return `
  <div class="eyebrow">SENIOR FULL-STACK · INTERVIEW DRILL</div>
  <h1>Answer out loud. Then reveal.</h1>
  <p class="lede">Say your whole answer before you reveal the model answer — that's the practice. Grade yourself honestly and the tool keeps resurfacing what you miss and retires what you know.</p>
  <div style="margin-top:20px">
    <span class="mono" style="font-size:12px;color:var(--muted)">${o.seen}/${o.total} attempted · ${o.mastered} mastered</span>
    <div class="meterTrack"><div style="height:100%;width:${mPct}%;background:${C.green}"></div><div style="height:100%;width:${sPct}%;background:${C.accent};opacity:.5"></div></div>
  </div>
  <button class="randomBtn" data-dom="all"><span class="t">Random</span><span class="s">everything, mixed — the real interview simulation</span></button>
  <div class="focusChips">
    <button class="chipBtn" data-dom="behavioral">Behavioral</button>
    <button class="chipBtn" data-dom="frontend">Frontend</button>
    <button class="chipBtn" data-dom="backend">Backend</button>
    <button class="chipBtn" data-dom="sysdesign">System design</button>
    <button class="chipBtn" data-dom="ai">AI-native</button>
    <button class="chipBtn" data-dom="testing">Testing</button>
    <button class="chipBtn" data-dom="commerce">Commerce</button>
  </div>
  ${essentials}
  ${sec("Behavioral","behavioral")}
  ${sec("Frontend","frontend")}
  ${sec("Backend","backend")}
  ${sec("System design & payments","sysdesign")}
  ${sec("AI-native practice","ai")}
  ${sec("Testing","testing")}
  ${sec("Commerce","commerce")}
  ${scoreCardHTML(o)}
  <div style="margin-top:26px" id="resetWrap"><button class="ghost" id="resetBtn">Reset progress</button></div>
  ${memoryOnly
    ? `<div class="note">This copy is running somewhere that blocks local storage — likely inside Claude — so ratings last only for this session. Save the file and open it in your own browser to keep your progress across sessions.</div>`
    : `<div class="note">Your progress is saved in this browser on this device. Close it and open the file again and it remembers your ratings.</div>`}
  `;
}

function scoreCardHTML(o){
  const lt=lifetime(), sd=standing();
  return `
  <div class="sectionLabel">Scorecard</div>
  <div class="scoreCard">
    <div class="scoreHead">
      <span class="scoreName">${profile.name?esc(profile.name):"No name set"}</span>
      <button class="editName" id="editName">${profile.name?"EDIT NAME":"ADD YOUR NAME"}</button>
    </div>
    <div class="scoreGrid">
      <div class="scoreCell"><div class="num" style="color:${C.green}">${lt.g}</div><div class="lbl">nailed</div></div>
      <div class="scoreCell"><div class="num" style="color:${C.amber}">${lt.y}</div><div class="lbl">shaky</div></div>
      <div class="scoreCell"><div class="num" style="color:${C.red}">${lt.r}</div><div class="lbl">missed</div></div>
    </div>
    <div class="scoreFoot">
      ${lt.total} ${lt.total===1?"rating":"ratings"} all time · ${o.seen}/${o.total} cards attempted · ${o.mastered} mastered<br/>
      standing now · <span style="color:${C.green}">${sd.g} nailed</span> · <span style="color:${C.amber}">${sd.y} shaky</span> · <span style="color:${C.red}">${sd.r} missed</span> · ${sd.nw} untouched<br/>
      last drilled · ${ago(lastDrilled())}
    </div>
  </div>`;
}

const mdQ=q=>esc(q).replace(/`([^`]+)`/g,(m,code)=>`<code>${code}</code>`);
function drillHTML(){
  if(!card) return `<div style="text-align:center;padding-top:60px"><div style="font-size:18px;margin-bottom:8px">No cards in this set.</div><button class="ghost" id="backBtn">Back</button></div>`;
  const domName={all:"Random · all topics",behavioral:"Behavioral",frontend:"Frontend",backend:"Backend",sysdesign:"System design & payments",ai:"AI-native",testing:"Testing",commerce:"Commerce"};
  const scopeLabel = scope.type==="category" ? CAT[scope.value].name
    : scope.type==="core" ? "Essentials · quick practice"
    : (domName[scope.value]||"Drill");
  const lvl={1:"fundamentals",2:"standard",3:"hard"}[card.level];
  const s=progress[card.id];
  const lastChip = s&&s.grade?`<span class="chip" style="border-color:transparent;color:${GRADE[s.grade].color}">last: ${GRADE[s.grade].label.toLowerCase()}</span>`:``;
  const tagChip = card.tag?`<span class="chip" style="color:var(--faint)">${esc(card.tag.toLowerCase())}</span>`:``;
  const answer = `<div class="aCard"><div class="qLabel" style="color:var(--accent)">MODEL ANSWER</div>`+
    card.a.split("||").map(p=>`<p>${esc(p)}</p>`).join("")+`</div>
    <div class="gradePrompt">How close was your spoken answer?</div>
    <div class="gradeRow">
      <button class="gradeBtn" data-grade="r" style="border-color:${C.red};color:${C.red}"><span class="l">Missed it</span><span class="h">1</span></button>
      <button class="gradeBtn" data-grade="y" style="border-color:${C.amber};color:${C.amber}"><span class="l">Shaky</span><span class="h">2</span></button>
      <button class="gradeBtn" data-grade="g" style="border-color:${C.green};color:${C.green}"><span class="l">Nailed it</span><span class="h">3</span></button>
    </div>`;
  const gate = `<div class="gate"><div class="gateHint">Say your full answer out loud first — subject, verb, all of it — as if you were in the room.</div>
    <button class="revealBtn" id="revealBtn">Reveal model answer</button><div class="kb">space / enter</div></div>`;
  const notePane = `<div class="aCard" style="border-left-color:${C.amber}"><div class="qLabel" style="color:${C.amber}">PRACTICE NOTE</div><p>${esc(pendingNote)}</p></div>
    <button class="revealBtn" id="continueBtn" style="margin-top:16px;width:100%">Continue</button><div class="kb">space / enter</div>`;
  return `
  <div class="drillTop">
    <button class="back" id="backBtn">← topics</button>
    <div class="tele"><span style="color:${C.green}">${session.g} nailed</span><span style="color:${C.amber}">${session.y} shaky</span><span style="color:${C.red}">${session.r} missed</span></div>
  </div>
  <div class="chips">
    <span class="chip">${scopeLabel}</span>
    <span class="chip" style="color:var(--faint)">${card.catName}</span>
    <span class="chip" style="border-color:transparent;color:${card.level===3?C.amber:C.faint}">${lvl}</span>
    ${tagChip}
    ${lastChip}
  </div>
  <div class="qCard"><div class="qLabel">QUESTION</div><div class="qText">${mdQ(card.q)}</div></div>
  ${pendingNote?notePane:(revealed?answer:gate)}
  `;
}

/* ---------------- wiring ---------------- */
function wire(){
  root.querySelectorAll("[data-dom]").forEach(b=>b.onclick=()=>startDrill({type:"domain",value:b.dataset.dom}));
  root.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>startDrill({type:"category",value:b.dataset.cat}));
  root.querySelectorAll("[data-core]").forEach(b=>b.onclick=()=>startDrill({type:"core"}));
  const rb=root.querySelector("#revealBtn"); if(rb) rb.onclick=()=>{revealed=true;render();};
  root.querySelectorAll("[data-grade]").forEach(b=>b.onclick=()=>grade(b.dataset.grade));
  const cb=root.querySelector("#continueBtn"); if(cb) cb.onclick=advance;
  const bk=root.querySelector("#backBtn"); if(bk) bk.onclick=()=>{view="home";pendingNote=null;persistSession();render();};
  const en=root.querySelector("#editName"); if(en) en.onclick=()=>{view="name";render();};
  const sv=root.querySelector("#saveName"); if(sv) sv.onclick=()=>{
    const i=root.querySelector("#nameInput"), v=(i.value||"").trim();
    if(!v){ i.focus(); return; }
    profile.name=v; profile.skipped=false; persistProfile(); view="home"; render();
  };
  const sk=root.querySelector("#skipName"); if(sk) sk.onclick=()=>{ profile.skipped=true; persistProfile(); view="home"; render(); };
  const cn=root.querySelector("#cancelName"); if(cn) cn.onclick=()=>{ view="home"; render(); };
  const ni=root.querySelector("#nameInput"); if(ni) ni.onkeydown=e=>{
    if(e.key==="Enter"){ e.preventDefault(); const b=root.querySelector("#saveName"); if(b) b.click(); }
  };
  const reset=root.querySelector("#resetBtn"); if(reset) reset.onclick=()=>{
    const w=root.querySelector("#resetWrap");
    w.innerHTML=`<span style="color:var(--muted);font-size:13px;margin-right:10px">Erase all ratings and your name?</span>
      <button class="ghost" id="yesReset" style="color:${C.red};border-color:${C.red}">Yes, reset</button>
      <button class="ghost" id="noReset" style="margin-left:8px">Cancel</button>`;
    root.querySelector("#yesReset").onclick=resetAll;
    root.querySelector("#noReset").onclick=()=>render();
  };
}
window.addEventListener("keydown",e=>{
  if(view!=="drill") return;
  if(pendingNote){ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); advance(); } return; }
  if(!revealed && (e.key===" "||e.key==="Enter")){ e.preventDefault(); revealed=true; render(); }
  else if(revealed){ if(e.key==="1")grade("r"); if(e.key==="2")grade("y"); if(e.key==="3")grade("g"); }
});

load();
if(!profile.name && !profile.skipped){
  view="name";
}else if(savedSession){
  const c=ALL.find(x=>x.id===savedSession.cardId);
  const scOK=savedSession.scope && (savedSession.scope.type==="category"?CAT[savedSession.scope.value]:true);
  if(c && scOK && poolFor(savedSession.scope).length){
    scope=savedSession.scope; session=savedSession.session||{g:0,y:0,r:0};
    card=c; recent=[c.id]; revealed=false; view="drill";
  }
}
render();
</script>
</body>
</html>
